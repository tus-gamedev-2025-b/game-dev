name: autofix.ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  inspect-code:
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.2.7f2-base-3.2.0
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      # see https://github.com/game-ci/unity-builder/issues/497#issuecomment-1407712495
      - name: Generate .sln via Unity
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          unity-editor -nographics -logFile /dev/stdout -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -serial "$UNITY_SERIAL"
          unity-editor -nographics -logFile /dev/stdout -projectPath ./tanks -executeMethod Packages.Rider.Editor.RiderScriptEditor.SyncSolution -quit

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
          cache: false

      - name: Install ReSharper GlobalTools
        run: dotnet tool install --global JetBrains.ReSharper.GlobalTools --version 2025.2.3

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Cleanup code with ReSharper
        run: |
          jb cleanupcode ./tanks/tanks.sln \
            --profile="Built-in: Full Cleanup" \
            --verbosity=INFO \
            --eXtensions=JetBrains.Unity \
            --exclude="**/Library/**.*;**/Logs/**.*"

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory /__w/game-dev/game-dev

      - name: autofix.ci
        uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27

      - name: Annotate
        run: |
          jb inspectcode ./tanks/tanks.sln \
            --format=Sarif \
            --output=results.sarif.json \
            --severity=WARNING \
            --build \
            --verbosity=INFO \
            --eXtensions=JetBrains.Unity

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@42213152a85ae7569bdb6bec7bcd74cd691bfe41 # v3.30.9
        with:
          sarif_file: results.sarif.json
          category: resharper-inspectcode

    permissions:
      contents: read
      security-events: write
