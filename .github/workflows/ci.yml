name: autofix.ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      unity: ${{ steps.filter.outputs.unity }}
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46.0.5
        id: changed-files

      - name: Determine changed paths
        id: filter
        run: |
          UNITY_CHANGED=false
          FRONTEND_CHANGED=false
          BACKEND_CHANGED=false

          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            if [[ "$file" == tanks/* ]] || [[ "$file" == .github/workflows/ci.yml ]]; then
              UNITY_CHANGED=true
            fi
            if [[ "$file" == backend/* ]] || [[ "$file" == .github/workflows/ci.yml ]]; then
              BACKEND_CHANGED=true
            fi
            if [[ "$file" != backend/* ]]; then
              FRONTEND_CHANGED=true
            fi
          done

          # workflow_dispatch always runs all jobs
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            UNITY_CHANGED=true
            FRONTEND_CHANGED=true
            BACKEND_CHANGED=true
          fi

          echo "unity=$UNITY_CHANGED" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND_CHANGED" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND_CHANGED" >> "$GITHUB_OUTPUT"

  inspect-code:
    needs: changes
    if: needs.changes.outputs.unity == 'true'
    runs-on: ubuntu-latest
    container: unityci/editor:ubuntu-6000.2.7f2-base-3.2.0
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      # see https://github.com/game-ci/unity-builder/issues/497#issuecomment-1407712495
      - name: Generate .sln via Unity
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          unity-editor -nographics -logFile /dev/stdout -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -serial "$UNITY_SERIAL"
          unity-editor -nographics -logFile /dev/stdout -projectPath ./tanks -quit
          unity-editor -nographics -logFile /dev/stdout -projectPath ./tanks -executeMethod Packages.Rider.Editor.RiderScriptEditor.SyncSolution -quit

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"
          cache: false

      - name: Install ReSharper GlobalTools
        run: dotnet tool install --global JetBrains.ReSharper.GlobalTools --version 2025.2.3

      - name: Add dotnet tools to PATH
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Setup tools
        uses: jdx/mise-action@be3be2260bc02bc3fbf94c5e2fed8b7964baf074 # v3.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm run generate:openapi

      - name: Cleanup code with ReSharper
        run: |
          jb cleanupcode ./tanks/tanks.sln \
            --profile="Built-in: Full Cleanup" \
            --verbosity=INFO \
            --eXtensions=JetBrains.Unity \
            --exclude="**/Library/**.*;**/Logs/**.*;"

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory /__w/game-dev/game-dev

      - name: Exclude autogenerated files from git
        run: |
          mkdir -p .git/info
          cat >> .git/info/exclude <<'EOF'
          *.prefab
          *.unity
          *.asset
          *.meta
          EOF
          git ls-files -z -m -- '*.asset' '*.prefab' '*.unity' '*.meta' | xargs -0 -r git update-index --skip-worktree
          git status --ignored -s

      - name: autofix.ci
        uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27

      - name: Annotate
        run: |
          jb inspectcode ./tanks/tanks.sln \
            --format=Sarif \
            --output=results.sarif.json \
            --severity=WARNING \
            --build \
            --verbosity=INFO \
            --eXtensions=JetBrains.Unity

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@42213152a85ae7569bdb6bec7bcd74cd691bfe41 # v3.30.9
        with:
          sarif_file: results.sarif.json
          category: resharper-inspectcode

    permissions:
      contents: read
      security-events: write

  prettier:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup tools
        uses: jdx/mise-action@be3be2260bc02bc3fbf94c5e2fed8b7964baf074 # v3.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm format:check

  test:
    needs: changes
    if: needs.changes.outputs.unity == 'true'
    name: Test in ${{ matrix.testMode }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        testMode:
          - editmode
          - playmode
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tanks/Library
          key: Library-test-${{ matrix.testMode }}-${{ hashFiles('tanks/Assets/**', 'tanks/Packages/**', 'tanks/ProjectSettings/**') }}
          restore-keys: |
            Library-test-${{ matrix.testMode }}-
            Library-test-
            Library-

      - uses: game-ci/unity-test-runner@61fd9aa167044adefc3ebda06a005e4312a9f897
        id: tests
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: tanks
          testMode: ${{ matrix.testMode }}
          artifactsPath: ${{ matrix.testMode }}-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.testMode }} Test Results
          coverageOptions: "generateAdditionalMetrics;generateHtmlReport;generateBadgeReport"

    permissions:
      contents: read
      checks: write

  build:
    needs: changes
    if: needs.changes.outputs.unity == 'true'
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneLinux64
          - StandaloneOSX
          - WebGL
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: tanks/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('tanks/Assets/**', 'tanks/Packages/**', 'tanks/ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Cleanup pre-installed SDKs
        run: |
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft /opt/google
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /opt/hostedtoolcache

      - uses: game-ci/unity-builder@d58755728721f9161882dc79ea5818bb2f3ad64e # v4.7.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: tanks
          targetPlatform: ${{ matrix.targetPlatform }}
          unityVersion: auto

    permissions:
      contents: read

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Backend - ${{ matrix.task.name }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: Lint & Format
            command: bun run check
          - name: Type Check
            command: bun run typecheck
          - name: Architecture
            command: bun run arch
          - name: OpenAPI Schema
            command: bun run openapi:check
          - name: Unit Tests
            command: bun run test:unit
          - name: Integration Tests
            command: bun run test:integration
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup tools
        uses: jdx/mise-action@be3be2260bc02bc3fbf94c5e2fed8b7964baf074 # v3.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.command }}

  backend-load-test:
    needs: [changes, backend]
    if: needs.changes.outputs.backend == 'true'
    name: Backend - Load Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup tools
        uses: jdx/mise-action@be3be2260bc02bc3fbf94c5e2fed8b7964baf074 # v3.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start server
        run: |
          DATABASE_PATH=./data/load-test.db bun run start &
          sleep 3
          curl -f http://localhost:3000/health

      - name: Run load test
        run: bun run load:smoke

      - name: Cleanup
        if: always()
        run: rm -f ./data/load-test.db*
