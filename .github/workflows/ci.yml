name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  inspect-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Generate .sln via Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          projectPath: ./tanks
          targetPlatform: StandaloneLinux64
          buildMethod: CI.GenerateSolution
          customParameters: -quit -batchmode -nographics

      # TODO: remove this after verifying .sln generation
      - name: print .sln files
        run: ls -R tanks/*.sln

      - name: Annotate
        uses: JetBrains/ReSharper-InspectCode@v0.11
        with:
          solution: ./tanks/tanks.sln
          eXtensions: JetBrains.Unity
          tool-version: 2025.2.3
          output: results.sarif.json
          sEverity: WARNING

      - name: Upload SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif.json

    permissions:
      contents: read
      security-events: write
